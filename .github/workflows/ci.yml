name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend — Maven build & test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: endpoint_posture
          POSTGRES_USER: ep_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ep_app -d endpoint_posture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test backend
        working-directory: backend
        env:
          DB_USERNAME: ep_app
          DB_PASSWORD: ci_test_password
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/endpoint_posture
          JWT_SECRET: ci-test-jwt-secret-at-least-256-bits-long-placeholder-value
          SEED_ADMIN_PASSWORD: ci-test-admin-password
          POSTURE_API_KEY: ci-test-agent-key
        run: mvn -B clean verify "-Duser.timezone=UTC"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies for API contract verification
        working-directory: frontend
        run: npm ci
      - name: Start packaged backend for frontend API integration
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5434/endpoint_posture
          DB_USERNAME: ep_app
          DB_PASSWORD: ci_test_password
          JWT_SECRET: ci-test-jwt-secret-at-least-256-bits-long-placeholder-value
          SEED_ADMIN_PASSWORD: ci-test-admin-password
          POSTURE_API_KEY: ci-test-agent-key
        run: |
          java -Duser.timezone=UTC -jar target/endpoint-posture-java-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8090/actuator/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Verify frontend API against running backend
        working-directory: frontend
        env:
          BACKEND_API_URL: http://127.0.0.1:8090
          BACKEND_API_USERNAME: admin
          BACKEND_API_PASSWORD: ci-test-admin-password
        run: npm run test:integration

  worker-runtime:
    name: Windows worker — Maven build, tests & DPAPI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: worker-runtime/pom.xml
      - name: Build and test Windows worker
        working-directory: worker-runtime
        run: mvn -B clean verify "-Duser.timezone=UTC"

  frontend:
    name: Frontend — lint, type-check, test & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-images:
    name: Build backend and frontend images
    runs-on: ubuntu-24.04
    needs: [backend, worker-runtime, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Compute lowercase image names
        id: images
        shell: bash
        run: |
          echo "backend=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: BACKEND_URL=http://backend:8090
          tags: |
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
            ${{ steps.images.outputs.frontend }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend